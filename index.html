<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RejuReju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one study column like a handout on a desk; the red sheet (赤シート) is the single bold device. */
:root {
  --paper: #f3f4f1;
  --sheet: #ffffff;
  --ink: #1d2230;
  --muted: #646b78;
  --rule: #dadde3;
  --navy: #283b5c;
  --red: #d61f1f;
  --redsheet: rgba(214, 31, 31, 0.88);
  --redtint: #fbe9e8;
  --good: #1f7a4d;
  --goodtint: #e3f3ea;
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14171d; --sheet: #1d212a; --ink: #e8eaee; --muted: #9aa1ad; --rule: #2e3440;
    --navy: #9fb6dd; --red: #ff5b52; --redsheet: rgba(232, 60, 52, 0.9); --redtint: #3a1f1f;
    --good: #5fd39a; --goodtint: #173528; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14171d; --sheet: #1d212a; --ink: #e8eaee; --muted: #9aa1ad; --rule: #2e3440;
  --navy: #9fb6dd; --red: #ff5b52; --redsheet: rgba(232, 60, 52, 0.9); --redtint: #3a1f1f;
  --good: #5fd39a; --goodtint: #173528; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--navy); color: #fff; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: 19px; letter-spacing: .04em; display: flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; }
.logo .chip { display: inline-block; width: 20px; height: 14px; background: var(--red); border-radius: 2px; transform: rotate(-6deg); }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs button { background: transparent; border: 0; color: rgba(255,255,255,.72); padding: 6px 12px; border-radius: 999px; font-weight: 500; }
nav.tabs button[aria-current="page"] { background: rgba(255,255,255,.16); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) header.top { background: #1d2a42; } :root:not([data-theme="light"]) body::before { background: #1d2a42; } }
:root[data-theme="dark"] header.top, :root[data-theme="dark"] body::before { background: #1d2a42; }

main { padding-block: 20px 60px; display: grid; gap: 20px; }
.notice { font-size: 13px; color: var(--muted); background: var(--sheet); border: 1px dashed var(--rule); border-radius: 8px; padding: 8px 12px; }
h2.sec { font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 8px 14px; border-radius: 8px; font-weight: 500; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* library */
.subject { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.intro { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.intro-head { display: flex; align-items: center; gap: 12px; }
.intro-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; letter-spacing: .04em; flex: 1; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.steps li { display: flex; gap: 10px; align-items: flex-start; background: var(--paper); border-radius: 10px; padding: 12px; }
.steps .no { font-size: 22px; line-height: 1.2; color: var(--red); font-weight: 700; flex: none; }
.steps b { display: block; font-size: 15px; line-height: 1.5; }
.steps p { margin: 4px 0 8px; font-size: 13px; color: var(--muted); line-height: 1.6; }
@media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }
.shead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--rule); }
.sname { background: none; border: 0; padding: 4px 0; font-size: 17px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; text-align: left; flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
.sname .caret { color: var(--red); width: 1em; flex: none; }
.sname small { font-weight: 400; color: var(--muted); font-size: 12px; white-space: nowrap; }
.shead .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.subject.closed .shead { border-bottom: 0; }
.lec-empty { padding: 14px 16px; color: var(--muted); font-size: 13px; }
.inp { border: 1px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 8px 12px; font-size: 15px; min-width: 0; flex: 1 1 200px; }
.shead .inp { background: var(--paper); }
.grow { flex: 1 1 100%; }
.lec { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--rule); }
.lec:first-of-type { border-top: 0; }
.lec .num { font-family: var(--font-num); font-size: 13px; color: var(--navy); border: 1.5px solid var(--navy); border-radius: 6px; text-align: center; padding: 2px 0; }
.lec .ttl { font-weight: 500; overflow-wrap: anywhere; }
.lec .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar { width: 80px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; display: inline-block; }
.bar > i { display: block; height: 100%; background: var(--good); }
.lec .acts { display: flex; gap: 6px; }
@media (max-width: 520px) { .lec { grid-template-columns: 48px minmax(0,1fr); } .lec .acts { grid-column: 1 / -1; } }
.tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--redtint); color: var(--red); font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 28px 16px; background: var(--sheet); border: 1px dashed var(--rule); border-radius: 12px; }
.drop { border: 2px dashed var(--rule); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); background: var(--sheet); }
.drop.over { border-color: var(--red); color: var(--red); }
.guide { gap: 8px; }
.guide h3 { font-size: 17px; }
.guide h4 { margin: 8px 0 0; font-size: 14px; }
.guide p, .guide li { font-size: 14px; line-height: 1.75; margin: 0; }
.guide ol, .guide ul { margin: 0; padding-left: 1.4em; display: grid; gap: 2px; }
.glead { font-size: 14px; line-height: 1.75; margin: 0; }
.gtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.gtable th, .gtable td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; line-height: 1.6; }
.gtable th { background: var(--paper); font-weight: 700; }
.foot p { margin: 6px 0 0; }
.peek { font-size: 13px; }
.peek summary { cursor: pointer; color: var(--navy); }
.peek-pg { border-top: 1px solid var(--rule); padding-top: 6px; margin-top: 6px; }
.peek-pg p { margin: 4px 0; }
.peek mark { background: var(--redtint); color: var(--red); font-weight: 700; padding: 0 2px; }
.pdfpage img { width: 100%; height: auto; display: block; }

/* add sheet */
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-size: 16px; }
.fields { display: grid; grid-template-columns: minmax(0, 2fr) 90px; gap: 10px; }
.fields .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
label.f input, label.f select { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 8px 10px; font-size: 15px; width: 100%; min-width: 0; }
.err { color: var(--red); font-size: 13px; }

/* handout viewer */
.finder textarea { width: 100%; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 15px; resize: vertical; min-height: 4.5em; }
.grid-form { display: grid; gap: 8px; }
.match { border-color: var(--red); }
.mq-text { font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.ox { display: inline-flex; gap: 6px; }
.ox button { width: 44px; height: 36px; border-radius: 8px; border: 1.5px solid var(--rule); background: var(--sheet); font-size: 18px; font-weight: 700; color: var(--muted); }
.ox button[aria-pressed="true"]:first-child { border-color: var(--good); background: var(--goodtint); color: var(--good); }
.ox button[aria-pressed="true"]:last-child { border-color: var(--red); background: var(--redtint); color: var(--red); }
.smode { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.acct { display: flex; align-items: center; gap: 8px; margin-left: 8px; }
.acct .who { font-size: 12px; color: rgba(255,255,255,.8); max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct .acct-btn { color: #fff; border-color: rgba(255,255,255,.35); background: transparent; }
.login .login-box { display: grid; gap: 10px; justify-items: start; }
.btn.big { font-size: 17px; padding: 12px 22px; border-radius: 12px; }
@media (max-width: 520px) { .acct .who { display: none; } }
.chks { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.chk { display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--rule); border-radius: 10px; background: var(--sheet); cursor: pointer; font-weight: 500; }
.chk input { width: 20px; height: 20px; accent-color: var(--red); margin: 0; }
.chk:has(input:checked) { border-color: var(--red); background: var(--redtint); }
.oxrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 360px; }
.hint { font-size: 13px; color: var(--muted); }
.wrapseg { flex-wrap: wrap; border-radius: 12px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: transparent; padding: 6px 14px; font-size: 13px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--sheet); }
.pdfpage { margin: 0; background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; scroll-margin-top: 80px; }
.pdfpage canvas { display: block; width: 100%; height: auto; background: #fff; }
.pdfpage figcaption { font-family: var(--font-num); font-size: 12px; color: var(--muted); padding: 4px 10px; border-top: 1px solid var(--rule); }
.slide { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; scroll-margin-top: 80px; }
.slide .ph { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
.slide .pn { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.slide h4 { margin: 0; font-size: 16px; text-wrap: balance; }
.slide p { margin: 4px 0; overflow-wrap: anywhere; }
.slide.hit { box-shadow: 0 0 0 2px var(--red); }
.mask { color: var(--red); font-weight: 700; }
.sheet-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: var(--navy); box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }
.sheet-fab.on { background: var(--red); }
.ocrmode { display: grid; gap: 6px; justify-items: center; margin-top: 10px; }
.inapp { background: var(--redtint); border: 1.5px solid var(--red); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; margin-bottom: 12px; }
.inapp p { margin: 0; font-size: 14px; line-height: 1.6; }
.inapp .btn { justify-self: start; }
.seg button.nopdf { opacity: .6; }
.seg button.nopdf small { display: block; font-size: 10px; font-weight: 500; }
.notice.flash { border-color: var(--red); color: var(--ink); }
.back-fab { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 20; border: 1px solid var(--rule); border-radius: 999px; padding: 12px 16px; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: var(--sheet); box-shadow: 0 4px 14px rgba(0,0,0,.2); cursor: pointer; }
.back-fab[hidden] { display: none; }
body { padding-bottom: 64px; }
.autosave { margin-top: 8px; font-size: 13px; }
.saved { color: var(--good); border-color: var(--good); justify-content: space-between; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--navy); text-decoration: underline; cursor: pointer; }
#sheetlist { padding-bottom: 56px; }
.sheet-on .mask { background: var(--redsheet); color: transparent; border-radius: 3px; cursor: pointer; padding: 0 2px; }
.sheet-on .mask.open { background: var(--redtint); color: var(--red); }
.viewer-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.viewer-head h2 { margin: 0; font-size: 20px; flex: 1 1 260px; min-width: 0; text-wrap: balance; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }

/* quiz */
.qcfg { display: grid; gap: 10px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; padding: 20px; display: grid; gap: 14px; position: relative; }
.card .where { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.card .where b { color: var(--navy); font-weight: 700; }
.kind { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.kind.m { color: var(--navy); } .kind.t { color: var(--red); }
.stem { font-size: 13px; font-weight: 700; color: var(--muted); }
.card .q { font-size: 18px; line-height: 1.9; overflow-wrap: anywhere; }
.card .q.aiq { font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
.card .q .ctx { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--red); background: var(--redtint); color: var(--red); text-align: center; padding: 0 6px; font-weight: 700; border-radius: 3px 3px 0 0; }
.answer-row { display: flex; gap: 8px; }
.answer-row input { flex: 1; min-width: 0; border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 10px 12px; font-size: 16px; }
.verdict { border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.verdict.ok { background: var(--goodtint); color: var(--good); }
.verdict.ng { background: var(--redtint); color: var(--red); }
.counter { font-family: var(--font-num); font-size: 13px; color: var(--muted); }
.score { text-align: center; display: grid; gap: 8px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 10px 14px; font-size: 16px; display: flex; gap: 10px; align-items: baseline; overflow-wrap: anywhere; }
.choice:hover:not(:disabled) { border-color: var(--navy); }
.choice .ix { font-family: var(--font-num); font-size: 13px; color: var(--muted); flex: none; }
.choice.fx .tx { font-family: var(--font-num); font-size: 15px; }
.choice.right { border-color: var(--good); background: var(--goodtint); color: var(--good); }
.choice.picked:not(.right) { border-color: var(--red); background: var(--redtint); color: var(--red); }
.choice:disabled { cursor: default; }
.explain { background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.explain .lbl { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.explain .body { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; }
.ctxlines { white-space: normal; display: grid; gap: 4px; font-size: 14px; }
a.btn { text-decoration: none; display: inline-block; }
.explain.err .body { color: var(--red); }
.score .big { font-family: var(--font-display); font-size: 30px; color: var(--navy); letter-spacing: .04em; }

/* search */
.search.nowrap { flex-wrap: nowrap; }
.search .btn { flex: none; }
.backrow { justify-content: center; margin-top: 8px; }
.search input { width: 100%; border: 1px solid var(--rule); background: var(--sheet); border-radius: 10px; padding: 12px 14px; font-size: 16px; }
.res { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; text-align: left; width: 100%; }
.res .src { font-size: 12px; color: var(--muted); }
.res .src b { color: var(--navy); }
.res .snip { overflow-wrap: anywhere; }
mark { background: #ffe58a; color: inherit; padding: 0 1px; border-radius: 2px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) mark { background: #6b5a12; } }
:root[data-theme="dark"] mark { background: #6b5a12; }
.list { display: grid; gap: 8px; }
.mlist { display: grid; }
.mrow { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--rule); }
.mrow .pn { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.mrow .mq { display: grid; min-width: 0; }
.mrow .mq b { overflow-wrap: anywhere; }
.mrow .mq span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow.off .mq { opacity: .45; text-decoration: line-through; }
@media (max-width: 520px) { .mrow { grid-template-columns: auto minmax(0,1fr) auto; } .mrow .kind { display: none; } }
.foot { font-size: 12px; color: var(--muted); padding-block: 0 32px; }
.confirm { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } } }
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <h1 class="logo"><span class="chip" aria-hidden="true"></span>RejuReju</h1>
    <nav class="tabs" aria-label="画面">
      <button id="tab-lib" data-view="lib" aria-current="page">本棚</button>
      <button id="tab-quiz" data-view="quiz">問題</button>
      <button id="tab-search" data-view="search">検索</button>
    </nav>
    <div id="acct" class="acct"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<input id="refile" type="file" accept="application/pdf,.pdf" hidden>
<footer class="wrap foot"><button class="btn small ghost" data-act="help">RejuReju 使い方ガイド</button><p>入れたレジュメは、ほかの利用者には見えません（管理者は管理画面から見ることができます）。ログインしていれば、原本（PDF・写真）もクラウドに保存されるので、どの端末やブラウザからでも見られます。問題は自動で作っているので、まちがいがあればレジュメで確かめてください。</p></footer>

<script>
// Shared extractor logic (same code goes into the page)
async function extractPage(page, OPS) {
  const ops = await page.getOperatorList();
  const runs = []; // {t, red}
  let fill = '#000000';
  const stack = [];
  let lastY = null, curY = 0;
  const isRed = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return r > 170 && g < 90 && b < 90;
  };
  const push = (t) => {
    if (!t) return;
    if (lastY !== null && Math.abs(curY - lastY) > 3) br();
    lastY = curY;
    const red = isRed(fill);
    const last = runs[runs.length - 1];
    if (last && last.red === red && last.t !== '\n') last.t += t;
    else runs.push({ t, red });
  };
  const br = () => { if (runs.length && runs[runs.length - 1].t !== '\n') runs.push({ t: '\n', red: false }); };
  const glyphs = (arr) => {
    let s = '';
    for (const g of arr) {
      if (g && typeof g === 'object' && g.unicode !== undefined) s += g.unicode;
      else if (typeof g === 'number' && g < -250) s += ' ';
    }
    return s;

function buildLecture(pagesRuns, opts = {}) {

  const seen = new Set();
  for (const { p, runs } of pagesRuns) {
    // split into lines of runs
    const lines = [[]];
    for (const r of runs) {
      if (r.t === '\n') { lines.push([]); continue; }
      lines[lines.length - 1].push({ t: norm(r.t), red: r.red });
    }
    const textOf = (l) => l.map((r) => r.t).join('');

      .map((l) => l.filter((r) => r.t.length))

    const title = textOf(kept[0]).replace(/\s+再掲$/, '').trim();

    pageLines.forEach((segs, bi) => {

  } catch { histDepth = d; }
  let fab = document.getElementById('backfab');

const CHUNK = 900 * 1024; // a Firestore document holds at most 1 MiB, so a file is stored in pieces
const MAX_CLOUD = 40 * 1024 * 1024;
const cloudOn = () => S.storage === 'db' && !!fdb && !!uid && typeof firebase !== 'undefined';
const fileCol = () => fdb.collection('users').doc(uid).collection('files');
let upChain = Promise.resolve();
function queueUpload(id, orig) {

}
async function cloudPut(id, orig) {
  const lec = rawDocs.find((d) => d.id === id); if (!lec || !cloudOn()) { delete S.cloudUp[id]; return; }
  if (lec.cloud) { S.cloudUp[id] = 'done'; return; }
  const parts = orig.photos ? orig.photos : [orig];
  if (parts.reduce((n, b) => n + (b.size || 0), 0) > MAX_CLOUD) { S.cloudUp[id] = 'big'; render(); return; }
  S.cloudUp[id] = 'working'; render();
  try {
    const meta = { kind: orig.photos ? 'photo' : 'pdf', files: [], at: new Date().toISOString() };
    for (let k = 0; k < parts.length; k++) {
      const u8 = new Uint8Array(await parts[k].arrayBuffer());
      const n = Math.max(1, Math.ceil(u8.length / CHUNK));
      for (let i = 0; i < n; i++) await fileCol().doc(`${id}_${k}_${i}`).set({ lec: id, k, i, n, data: firebase.firestore.Blob.fromUint8Array(u8.subarray(i * CHUNK, (i + 1) * CHUNK)) });
      meta.files.push({ n, size: u8.length, type: parts[k].type || (orig.photos ? 'image/jpeg' : 'application/pdf') });

}
async function cloudGet(lec) {

    blobs.push(new Blob(bufs, { type: f.type }));

}

const IDB = {
  db: null,
  open() {
    if (this.db) return this.db;
    this.db = new Promise((res, rej) => { const r = indexedDB.open('rejukun', 1); r.onupgradeneeded = () => r.result.createObjectStore('pdfs'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    return this.db;
  },
  async run(mode, fn) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('pdfs', mode); const req = fn(t.objectStore('pdfs')); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  put(k, v) { return this.run('readwrite', (st) => st.put(v, k)); },
  get(k) { return this.run('readonly', (st) => st.get(k)); },
  del(k) { return this.run('readwrite', (st) => st.delete(k)); },

// ---------- find the handout page for a quiz question ----------
function grams(text) {
  const t = text.normalize('NFKC').toLowerCase();
  const out = new Set();
  const segs = t.match(/[\p{Script=Han}\p{Script=Katakana}ー]+|[a-z0-9$]+/gu) || [];
  for (const sg of segs) {
    if (sg.length === 1) { if (/\p{Script=Han}/u.test(sg)) out.add(sg); continue; }
    if (/^[a-z0-9$]+$/.test(sg)) { if (sg.length >= 2 && !/^\d+$/.test(sg)) out.add(sg); continue; }
    for (let i = 0; i < sg.length - 1; i++) out.add(sg.slice(i, i + 2));
  }
  return out;
}
function findPages(query) {
  const docs = [];
  for (const l of S.lectures) for (const pg of l.pages) {
    const text = [pg.title, ...pg.lines.map((ln) => ln.map((x) => x[0]).join(''))].join(' ');
    if (text.trim().length < 6) continue;
    docs.push({ l, p: pg.p, title: pg.title, g: grams(text), len: text.length });
  }
  if (!docs.length) return [];
  const df = new Map();
  for (const d of docs) for (const g of d.g) df.set(g, (df.get(g) || 0) + 1);
  const q = grams(query); const N = docs.length;
  const scored = docs.map((d) => {
    let sc = 0;
    for (const g of q) if (d.g.has(g)) sc += Math.log(1 + N / df.get(g)) * (g.length > 2 ? 1.5 : 1);
    return { ...d, score: sc / (1 + Math.log(1 + d.len / 400)) };
  }).filter((d) => d.score > 0).sort((a, b) => b.score - a.score);
  return scored.slice(0, 5).map((d) => ({ lecId: d.l.id, p: d.p, title: d.title, subject: d.l.subject, num: d.l.num, score: d.score }));
}
function openMatch(query) {
  const cands = findPages(query);
  if (!cands.length) { S.findMsg = '関係しそうなページが見つかりませんでした。本棚にその回のレジュメが入っているか確かめてください。'; render(); return; }
  S.findMsg = '';
  S.matchInfo = { query, cands };
  const top = cands[0];
  if (S.openLec !== top.lecId) pdfHostEl = null;
  S.openLec = top.lecId; S.openPage = top.p; S.lecMode = S.noPdf[top.lecId] ? 'text' : 'pdf';
  render(); window.scrollTo(0, 0);
}

function searchResults() {
  const q = S.q.trim();
  let h = '';
  if (!q) return h + `<p class="notice">本棚にある全部のレジュメから探します。「この単語どの回に出てた？」がすぐ分かります。</p>`;
  const nq = q.normalize('NFKC').toLowerCase();
  const res = [];
  for (const l of S.lectures) for (const pg of l.pages) {
    const lines = [pg.title, ...pg.lines.slice(1).map((segs) => segs.map((s) => s[0]).join(''))];
    for (const line of lines) {
      const at = line.toLowerCase().indexOf(nq);
      if (at >= 0) { res.push({ l, pg, line, at }); break; }
    }
  }
  if (!res.length) return h + `<p class="notice">「${esc(q)}」は見つかりませんでした。</p>`;
  h += `<h2 class="sec">${res.length}ページで見つかりました</h2>`;
  for (const r of res.slice(0, 80)) {
    const start = Math.max(0, r.at - 30);
    const snip = (start ? '…' : '') + r.line.slice(start, r.at + q.length + 50);
    const hi = esc(snip).split(esc(r.line.substr(r.at, q.length))).join(`<mark>${esc(r.line.substr(r.at, q.length))}</mark>`);
    h += `<button class="res" data-act="goto" data-id="${r.l.id}" data-p="${r.pg.p}"><span class="src"><b>${esc(r.l.subject)} 第${r.l.num ?? '?'}回</b> · p.${r.pg.p} · ${esc(r.pg.title)}</span><span class="snip">${hi}</span></button>`;
  }
  return h;
}

  else if (act === 'back') { S.noPdfFlash = false; S.openLec = null; S.confirmDel = null; S.openPage = null; render(); const y = S.backY || 0; S.backY = 0; requestAnimationFrame(() => window.scrollTo(0, y)); }
  else if (act === 'solve') { S.openLec = null; S.view = 'quiz'; const l = S.lectures.find((x) => x.id === id); S.quizCfg = { ...S.quizCfg, subject: l ? l.subject : '', lec: id }; S.quiz = null; startQuiz(); }
  else if (act === 'start') startQuiz();
  else if (act === 'smode') { S.progress.subjectMode = { ...(S.progress.subjectMode || {}), [b.dataset.sub]: b.dataset.v }; queueProgress(); render(); }
  else if (act === 'start-sub') { S.quizCfg.subject = b.dataset.sub; S.quizCfg.lec = 'all'; startQuiz(); }
  else if (act === 'start-lec') { const l = S.lectures.find((x) => x.id === id); S.quizCfg.subject = l ? l.subject : ''; S.quizCfg.lec = id; startQuiz(); }
  else if (act === 'ox') {
    const k = b.dataset.k, on = b.dataset.v === '1';
    let ch = S.quizCfg.answer !== 'type', ty = S.quizCfg.answer !== 'choice';
    if (k === 'choice') { ch = on; if (!ch) ty = true; } else { ty = on; if (!ty) ch = true; }
    S.quizCfg.answer = ch && ty ? 'auto' : ch ? 'choice' : 'type';
    LS.set('rs-quiz-prefs', { answer: S.quizCfg.answer, mode: S.quizCfg.mode }); render();
  }
  else if (act === 'qmode') { S.quizCfg.mode = b.dataset.v; S.quizMsg = ''; LS.set('rs-quiz-prefs', { answer: S.quizCfg.answer, mode: S.quizCfg.mode }); render(); }
  else if (act === 'quiz-reset') { S.quiz = null; render(); window.scrollTo(0, 0); }
  else if (act === 'explain') explain();
  else if (act === 'lookup') { S.lookup[S.quiz.list[S.quiz.i].k] = 1; render(); }
  else if (act === 'choose') { const e = S.quiz.list[S.quiz.i]; const c = e.choices[Number(b.dataset.i)]; judge(c, c === e.it.a); }
  else if (act === 'reveal') { S.quiz.result = { ok: false, typed: '' }; S.quiz.wrong.push(S.quiz.list[S.quiz.i]); record(false); render(); }
  else if (act === 'next') { S.quiz.i++; S.quiz.result = null; render(); }
  else if (act === 'mark-ok') { S.quiz.result.ok = true; S.quiz.right++; const k = S.quiz.list[S.quiz.i].k; const s = S.progress.stats[k]; S.progress.stats[k] = [s[0] + 1, Math.max(0, s[1] - 1), 1]; S.quiz.wrong = S.quiz.wrong.filter((x) => x !== S.quiz.list[S.quiz.i]); queueProgress(); render(); }
  else if (act === 'hide-item') { S.progress.hidden[S.quiz.list[S.quiz.i].k] = 1; queueProgress(); S.quiz.i++; S.quiz.result = null; render(); }
  else if (act === 'retry-wrong') { const w = S.quiz.wrong.slice(); S.quiz = { list: w, i: 0, right: 0, wrong: [], result: null }; render(); }
  else if (act === 'del') { S.confirmDel = id; render(); }
  else if (act === 'del-no') { S.confirmDel = null; render(); }
  else if (act === 'del-yes') {
    try { await IDB.del(id); } catch { }
    try { await deleteLecture(id); } catch { }
    if (S.storage === 'local' || id === SAMPLE_ID) { rawDocs = rawDocs.filter((d) => d.id !== id); mergeLectures(rawDocs); }
    S.openLec = null; S.confirmDel = null; render();
  }
  else if (act === 'drop-pending') { S.pending = S.pending.filter((p) => p.key !== b.dataset.key); render(); }
  else if (act === 'save-pending' || act === 'save-all') {
    const list = act === 'save-all' ? S.pending.slice() : S.pending.filter((x) => x.key === b.dataset.key);
    if (!list.length) return;
    b.disabled = true;
    for (const p of list) {
      const k = p.key, sub = $('#sub-' + k), num = $('#num-' + k), ttl = $('#ttl-' + k);
      if (sub) p.subject = sub.value.trim() || '未分類';
      if (num) p.num = num.value === '' ? null : parseInt(num.value, 10);
      if (ttl) p.title = ttl.value.trim();
      try { await savePending(p); S.pending = S.pending.filter((x) => x.key !== k); S.parseErr = ''; }
      catch (err) { S.parseErr = saveErrMsg(err); break; }
    }
    render();
  }
});
function startQuiz() {
  const list = quizPool();
  if (!list.length) {
    S.quiz = null;
    S.quizMsg = S.quizCfg.mode === 'wrong' ? 'ここには、まちがえた問題はありません。' : S.quizCfg.mode === 'new' ? 'ここの問題は、もう全部一度解いています。' : 'ここには出せる問題がありません。';
    render(); return;
  }
  S.quizMsg = '';
  const mode = S.quizCfg.answer || 'auto';
  for (const e of list) {
    const pool = [...new Set(S.lectures.filter((l) => l.subject === e.lec.subject).flatMap((l) => l.items.map((x) => x.a)))];
    const want = mode === 'choice' || (mode === 'auto' && isMath(e.it));
    if (e.it.ai) { e.choices = shuffle(e.it.cp4.slice()); continue; }
    if (e.it.cp) { e.choices = shuffle([e.it.a, ...shuffle(e.it.cp.filter((x) => x !== e.it.a)).slice(0, 3)]); continue; }
    e.choices = want ? makeChoices(e.it.a, pool.length >= 4 ? pool : [...pool, ...S.lectures.flatMap((l) => l.items.map((x) => x.a))]) : null;
  }
  S.quiz = { list, i: 0, right: 0, wrong: [], result: null };
  render(); window.scrollTo(0, 0);
}
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'newsubform') {
    e.preventDefault();
    const name = $('#newsub').value.trim();
    if (!name) return;
    if (subjects().includes(name)) { S.libMsg = `「${name}」はもうあります。`; render(); return; }
    setSubjects([...subjectList(), name]); S.newSub = ''; S.libMsg = ''; render(); return;
  }
  if (e.target.id === 'findform') {
    e.preventDefault();
    const t = $('#quiztext').value.trim(); S.quizText = t;
    if (t) { S.curMatchI = 0; openMatch(t); }
    return;
  }
  if (e.target.id === 'metaform') {
    e.preventDefault();
    const id = e.target.dataset.id;
    const numV = $('#meta-num').value;
    const patch = { subject: $('#meta-sub').value, num: numV === '' ? null : parseInt(numV, 10), title: $('#meta-ttl').value.trim() };
    const d = rawDocs.find((x) => x.id === id); if (d) Object.assign(d, patch);
    try {
      if (S.storage === 'db') await userCol().doc(id).update(patch);
      else { const all = LS.get('rs-lectures', {}); if (all[id]) { Object.assign(all[id], patch); LS.set('rs-lectures', all); } }
    } catch (err) { if (refused(err)) { toLocal(); const all = LS.get('rs-lectures', {}); if (all[id]) { Object.assign(all[id], patch); LS.set('rs-lectures', all); } } }
    S.editMeta = null; mergeLectures(rawDocs); render(); return;
  }
  if (e.target.id === 'renameform') {
    e.preventDefault();
    const old = e.target.dataset.sub, nu = $('#rename').value.trim();
    S.renaming = null;
    if (nu && nu !== old) {
      const list = subjectList().includes(old) ? subjectList().map((x) => (x === old ? nu : x)) : [...subjectList(), nu];
      setSubjects(list);
      if (S.collapsed[old]) { delete S.collapsed[old]; S.collapsed[nu] = 1; LS.set('rs-collapsed', S.collapsed); }
      for (const l of S.lectures.filter((x) => x.subject === old)) {
        if (l.builtin) { S.progress.sampleSubject = nu; continue; }
        const d = rawDocs.find((x) => x.id === l.id); if (d) d.subject = nu;
        try {
          if (S.storage === 'db') await userCol().doc(l.id).update({ subject: nu });
          else { const all = LS.get('rs-lectures', {}); if (all[l.id]) { all[l.id].subject = nu; LS.set('rs-lectures', all); } }
        } catch { S.libMsg = '名前を変更できなかった回があります。もう一度お試しください。'; }
      }
      queueProgress();
      mergeLectures(rawDocs);
    }
    render(); return;
  }
  if (e.target.id !== 'ansform') return;
  e.preventDefault();
  const Q = S.quiz; const typed = $('#ans').value.trim();
  if (!typed) return;
  const it = Q.list[Q.i].it;
  judge(typed, normAns(typed) === normAns(it.a));
});
function judge(typed, ok) {
  const Q = S.quiz;
  Q.result = { ok, typed };
  if (ok) Q.right++; else Q.wrong.push(Q.list[Q.i]);
  record(ok); render();
  const nb = $('#nextbtn'); if (nb && !TOUCH) nb.focus({ preventScroll: true });
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'newsub') { S.newSub = e.target.value; return; }
  if (e.target.id === 'q') { S.q = e.target.value; const r = $('#results'); if (r) r.innerHTML = searchResults(); }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'shot') { const f = t.files && t.files[0]; t.value = ''; if (f) readScreenshot(f); return; }
  if (t.id === 'refile') {
    const f = t.files && t.files[0]; t.value = '';
    if (!f || !S.reattachId) return;
    try { await IDB.put(S.reattachId, f); queueUpload(S.reattachId, f); delete S.noPdf[S.reattachId]; S.lecMode = 'pdf'; pdfHostEl = null; } catch { S.libMsg = 'この端末にはPDFを保存できませんでした。'; }
    S.reattachId = null; render(); return;
  }
  if (t.id === 'file') { handleFiles(t.files); t.value = ''; }
  if (t.id === 'photo') { const fs = [...(t.files || [])]; t.value = ''; if (fs.length) handlePhotos(fs); }
  else if (t.id === 'sheet') setSheet(t.checked);
  else if (t.id === 'autosave') { S.autoSave = t.checked; LS.set('rs-autosave', t.checked); }
  else if (t.id === 'cfg-sub') { S.quizCfg.subject = t.value; S.quizCfg.lec = 'all'; render(); }
  else if (t.id === 'cfg-lec') { S.quizCfg.lec = t.value; render(); }
  else if (t.id === 'ans-choice' || t.id === 'ans-type') {
    let ch = $('#ans-choice').checked, ty = $('#ans-type').checked;
    if (!ch && !ty) { if (t.id === 'ans-choice') ty = true; else ch = true; }
    S.quizCfg.answer = ch && ty ? 'auto' : ch ? 'choice' : 'type';
    LS.set('rs-quiz-prefs', { answer: S.quizCfg.answer, mode: S.quizCfg.mode }); render();
  }
  else if (t.id === 'cfg-ans') { S.quizCfg.answer = t.value; }
  else if (t.id === 'cfg-mode') { S.quizCfg.mode = t.value; render(); }
});
document.addEventListener('paste', (e) => {
  if (S.view !== 'search' || S.openLec || !S.canImage) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find((x) => x.type.startsWith('image/'));
  if (item) { e.preventDefault(); const f = item.getAsFile(); if (f) readScreenshot(f); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('mask')) e.target.classList.toggle('open');
});
const dropOk = () => S.view === 'lib' && !S.openLec && (S.authState !== 'out' || S.guest) && S.authState !== 'checking';
const hasFiles = (e) => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
['dragover', 'dragenter'].forEach((ev) => document.addEventListener(ev, (e) => { if (!hasFiles(e) || !dropOk()) return; e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); }));
document.addEventListener('dragleave', (e) => { if (e.relatedTarget) return; const d = $('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', async (e) => {
  if (!hasFiles(e) || !dropOk()) return;
  e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over');
  const fs = [...e.dataTransfer.files];
  const imgs = fs.filter((f) => /^image\//.test(f.type)), pdfs = fs.filter((f) => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (!imgs.length && !pdfs.length) { S.parseErr = 'PDFか写真（画像）を入れてください。'; render(); return; }
  if (pdfs.length) await handleFiles(pdfs);
  if (imgs.length) await handlePhotos(imgs);
});
init();
